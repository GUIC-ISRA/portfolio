<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edem Israël Gbegnedji — Développeur Full Stack Web &amp; Mobile</title>
    <meta
      name="description"
      content="Portfolio d'Edem Israël Gbegnedji, développeur full stack basé à Lomé (Togo). Applications web et mobiles avec Laravel, React et Flutter."
    />
    <meta name="author" content="Edem Israël Gbegnedji" />
    <meta name="theme-color" content="#07080C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F6FE" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Précharge le portrait de l'accueil (élément principal de la page) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-cutout-1100.webp"
      imagesrcset="/images/hero-cutout-700.webp 700w, /images/hero-cutout-1100.webp 1100w"
      imagesizes="(min-width: 1024px) 430px, 80vw"
      fetchpriority="high"
    />

    <link rel="canonical" href="https://edem-gbegnedji.vercel.app/" />

    <!-- Open Graph (aperçu LinkedIn / WhatsApp / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://edem-gbegnedji.vercel.app/" />
    <meta property="og:site_name" content="Edem Israël Gbegnedji" />
    <meta property="og:image" content="https://edem-gbegnedji.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Edem Israël Gbegnedji — Développeur Full Stack Web & Mobile" />
    <meta property="og:title" content="Edem Israël Gbegnedji — Développeur Full Stack Web & Mobile" />
    <meta
      property="og:description"
      content="Applications web et mobiles fiables, pensées pour fonctionner même quand la connexion ne suit pas."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Aperçu sur X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edem Israël Gbegnedji — Développeur Full Stack Web & Mobile" />
    <meta name="twitter:description" content="Applications web et mobiles fiables, pensées pour fonctionner même quand la connexion ne suit pas." />
    <meta name="twitter:image" content="https://edem-gbegnedji.vercel.app/og-image.jpg" />

    <!-- Données structurées : aide Google à comprendre qui est la personne présentée -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Edem Israël Gbegnedji",
        "url": "https://edem-gbegnedji.vercel.app/",
        "image": "https://edem-gbegnedji.vercel.app/og-image.jpg",
        "jobTitle": "Développeur Full Stack Web & Mobile",
        "email": "mailto:israelgbegnedji@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Lomé", "addressCountry": "TG" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "ESIG Global Success" },
        "knowsAbout": ["Laravel", "React", "Flutter", "PHP", "JavaScript", "MySQL", "SQLite", "API REST"],
        "knowsLanguage": ["fr", "en", "ee"],
        "sameAs": [
          "https://github.com/GUIC-ISRA",
          "https://www.linkedin.com/in/edem-isra%C3%ABl-gbegnedji-b05b15351/"
        ]
      }
    </script>

    <!-- Applique le thème avant l'affichage pour éviter un flash de couleur -->
    <script>
      (function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
